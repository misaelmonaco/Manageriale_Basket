name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.3

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # --no-frozen-lockfile because pnpm defaults to a frozen lockfile in CI.
      # Switch this back to a plain `pnpm install` once pnpm-lock.yaml is
      # regenerated and committed.
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      # The API's types and tests import the generated Prisma client, so it has
      # to exist before anything is type-checked.
      - name: Generate Prisma client
        run: pnpm --filter @basket/api prisma:generate

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm --filter @basket/api test

      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
